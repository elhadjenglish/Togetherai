  await loadHousehold();const i=await sb.rpc('create_invite',{p_ttl_hours:48});S.busy2=false;S.inv=i.error?null:i.data;S.gate='invite';render()})},
 join(){return guard(async()=>{const code=val('g-code');S.f={...S.f,code};
  if(code.replace(/[^A-Za-z0-9]/g,'').length<8){S.err='أدخل رمز الدعوة كاملًا.';return render()}
  S.busy2=true;S.err='';render();const r=await sb.rpc('join_household',{p_code:code});S.busy2=false;
  if(r.error){S.err=msgOf(r.error);return render()}
  if(!r.data||!r.data.ok){S.err=JOIN_ERR[r.data&&r.data.error]||'تعذّر الانضمام. حاول مرة أخرى.';return render()}
  await loadHousehold();S.gate=null;S.tab='home';toast('🏡 انضممت إلى الأسرة');render()})},
 toapp(){S.gate=null;S.tab='home';render()},
 mkinv(){return guard(async()=>{S.err='';S.busy2=true;render();const r=await sb.rpc('create_invite',{p_ttl_hours:48});S.busy2=false;
  if(r.error)S.err=msgOf(r.error);else S.inv=r.data;render()})},
 copyinv(){const c=S.inv&&S.inv.code;if(!c)return;try{navigator.clipboard.writeText(c).then(()=>toast('تم نسخ الرمز ✅'),()=>toast('انسخ الرمز يدويًا'))}catch(e){toast('انسخ الرمز يدويًا')}},
 refresh(){return guard(async()=>{await loadHousehold();render()})}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!S.gate)return;const id=e.target&&e.target.id;
 if(id==='g-pass'||id==='g-email'||id==='g-name')A[S.mode==='signup'?'signup':'login']();else if(id==='g-code')A.join();else if(id==='g-hname')A.mkhh()});

boot();
